<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Крестики-нолики</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #000000);
    --cell-bg: var(--tg-theme-secondary-bg-color, #f0f0f0);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; user-select: none;
  }
  h1 { font-size: 22px; margin: 10px 0 8px; font-weight: 600; }
  #status {
    font-size: 16px; margin-bottom: 18px; height: 22px;
    opacity: 0.85; text-align: center;
  }
  #board {
    display: grid;
    grid-template-columns: repeat(3, 88px);
    grid-template-rows: repeat(3, 88px);
    gap: 8px;
  }
  .cell {
    background: var(--cell-bg);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 46px; font-weight: bold;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.15s;
  }
  .cell:active:not(.taken) { transform: scale(0.94); }
  .cell.taken { cursor: default; }
  .cell.x { color: #e74c3c; }
  .cell.o { color: #3498db; }
  .cell.win { background: rgba(46, 204, 113, 0.35); }
  #reset {
    margin-top: 26px; padding: 13px 34px;
    font-size: 16px; font-weight: 500;
    border: none; border-radius: 12px;
    background: var(--btn); color: var(--btn-text);
    cursor: pointer;
    transition: opacity 0.15s;
  }
  #reset:active { opacity: 0.8; }
</style>
</head>
<body>
<h1>Крестики-нолики</h1>
<div id="status">Твой ход (❌)</div>
<div id="board"></div>
<button id="reset">Заново</button>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const WIN_LINES = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];
let board, gameOver, highlight;

function checkWinner(b, m) {
  return WIN_LINES.some(line => line.every(i => b[i] === m));
}
function winningLine(b, m) {
  return WIN_LINES.find(line => line.every(i => b[i] === m)) || [];
}
function isFull(b) { return b.every(c => c !== ""); }

function minimax(b, depth, isMax, alpha, beta) {
  if (checkWinner(b, "O")) return 10 - depth;
  if (checkWinner(b, "X")) return depth - 10;
  if (isFull(b)) return 0;
  if (isMax) {
    let best = -Infinity;
    for (let i = 0; i < 9; i++) {
      if (b[i] === "") {
        b[i] = "O";
        best = Math.max(best, minimax(b, depth+1, false, alpha, beta));
        b[i] = "";
        alpha = Math.max(alpha, best);
        if (beta <= alpha) break;
      }
    }
    return best;
  } else {
    let best = Infinity;
    for (let i = 0; i < 9; i++) {
      if (b[i] === "") {
        b[i] = "X";
        best = Math.min(best, minimax(b, depth+1, true, alpha, beta));
        b[i] = "";
        beta = Math.min(beta, best);
        if (beta <= alpha) break;
      }
    }
    return best;
  }
}

function botMove(b) {
  let bestScore = -Infinity, bestMove = null;
  for (let i = 0; i < 9; i++) {
    if (b[i] === "") {
      b[i] = "O";
      const score = minimax(b, 0, false, -Infinity, Infinity);
      b[i] = "";
      if (score > bestScore) { bestScore = score; bestMove = i; }
    }
  }
  return bestMove;
}

const boardEl = document.getElementById("board");
const statusEl = document.getElementById("status");

function render() {
  boardEl.innerHTML = "";
  board.forEach((cell, i) => {
    const d = document.createElement("div");
    let cls = "cell";
    if (cell) cls += " taken " + cell.toLowerCase();
    if (highlight.includes(i)) cls += " win";
    d.className = cls;
    d.textContent = cell === "X" ? "❌" : cell === "O" ? "⭕" : "";
    d.onclick = () => playerMove(i);
    boardEl.appendChild(d);
  });
}

function endGame(result) {
  gameOver = true;
  if (result === "X") {
    statusEl.textContent = "🎉 Ты победил!";
    highlight = winningLine(board, "X");
  } else if (result === "O") {
    statusEl.textContent = "Бот выиграл 😈";
    highlight = winningLine(board, "O");
  } else {
    statusEl.textContent = "Ничья";
  }
  render();
  if (tg?.HapticFeedback) {
    tg.HapticFeedback.notificationOccurred(result === "X" ? "success" : "error");
  }
}

function playerMove(i) {
  if (gameOver || board[i] !== "") return;
  board[i] = "X";
  render();
  if (checkWinner(board, "X")) return endGame("X");
  if (isFull(board)) return endGame("draw");

  statusEl.textContent = "Ход бота...";
  setTimeout(() => {
    const m = botMove(board);
    if (m !== null) board[m] = "O";
    render();
    if (checkWinner(board, "O")) return endGame("O");
    if (isFull(board)) return endGame("draw");
    statusEl.textContent = "Твой ход (❌)";
  }, 250);
}

function newGame() {
  board = ["","","","","","","","",""];
  gameOver = false;
  highlight = [];
  board[4] = "O"; // бот ходит первым — занимает центр
  statusEl.textContent = "Твой ход (❌)";
  render();
}

document.getElementById("reset").onclick = newGame;
newGame();
</script>
</body>
</html>
